# Practical 1 — QLoRA fine-tune config, tuned for a 4 GB RTX 3050 Ti.
# Every value here is deliberately conservative. Raise things only after a
# full run has completed once without an OOM.

model:
  # First choice. Falls back are documented in the README.
  base_id: "Qwen/Qwen2.5-0.5B-Instruct"
  max_seq_length: 512          # short on purpose: VRAM scales with this
  trust_remote_code: false

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "models/financial-compliance-qwen"
  num_train_epochs: 3
  per_device_train_batch_size: 1     # 4 GB VRAM: keep at 1
  gradient_accumulation_steps: 16    # effective batch size = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 0.3
  optim: "paged_adamw_8bit"          # paged: survives VRAM spikes
  fp16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 100                    # checkpoint cadence
  save_total_limit: 3                # bounded, so the SSD survives
  seed: 42

data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  eval_steps: 100
